<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indie Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2140; }
  /* the 4 px padding right/bottom reserves room for the canvas shadow when centring */
  body { display: flex; align-items: center; justify-content: center;
         box-sizing: border-box; padding: 0 4px 4px 0;
         touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; background: #1e2140; outline: none; cursor: pointer;
           border: 3px solid #0b0d1f; box-shadow: 4px 4px 0 #0b0d1f;
           image-rendering: crisp-edges; image-rendering: pixelated; }
  /* The Tuwaiq Academy logo is shown as a normal image on a white plate over the canvas,
     at full resolution (never redrawn, recoloured or pixelated) */
  #logo { position: fixed; display: none; box-sizing: border-box; pointer-events: none;
          background: #ffffff; border: 2px solid #0b0d1f;
          align-items: center; justify-content: center; }
  #logo img { display: block; width: 88%; height: 72%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Indie Run, an endless runner game"></canvas>
<div id="logo"><img alt="Tuwaiq Academy logo"></div>
<script>
// Real numbers from the clean data. The dashboard replaces everything between the two
// markers; the values below are only a fallback for opening this file on its own.
window.GAME_DATA = /*GAME_DATA*/{"releases": {"2020": 6089, "2021": 5692, "2022": 5991, "2023": 8194, "2024": 12266}, "indie_hit_rate": 4.2, "overall_hit_rate": 5.0, "few_reviews_pct": 43.1, "top_subgenres": [{"name": "Cozy", "hit_rate": 19.8, "games": 96}, {"name": "Colony Sim", "hit_rate": 13.7, "games": 212}, {"name": "Management", "hit_rate": 12.6, "games": 676}], "powerups": {"multiplayer": 7.9, "single_player": 3.4, "languages_10plus": 16.0, "one_language": 1.6, "cozy": 19.8}}/*END_GAME_DATA*/;
// The dashboard writes the logo in here as a data URI (the iframe cannot load repo files);
// opened on its own, the file falls back to the image next to it.
window.TUWAIQ_LOGO = /*TUWAIQ_LOGO*/""/*END_TUWAIQ_LOGO*/;
</script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- setup
  const D = window.GAME_DATA;
  const W = 288, H = 162, GROUND = 138, PX = 40, STEP = 1 / 60;
  const GRAVITY = 1000, JUMP_V = 300, DOUBLE_V = 265;  // single jump: 45 px high, 0.6 s in the air
  const LEVEL_TIME = 15, EASY_TIME = 10, LIVES = 3, GOAL = 10000;
  // Tunnels: the ceiling ends 11 px above the ground. Standing (12 px tall) hits it, sliding
  // (6 px) fits. A slide hop lifts a 5 px tall body 4.5 px, so it clears a 3 px floor bug and
  // never reaches the ceiling (4.5 + 5 < 11). It rises fast (above the bug within 0.02 s, so a
  // press with the bug right in front still works), hangs, then drops: ~0.4 s over the bug.
  const CEIL = GROUND - 11, SPIKE_H = 3, SPIKE_W = 6;
  const HOP_H = 4.5, HOP_RISE = 150, HOP_HANG = 0.36, HOP_FALL_G = 600;
  const PAL = {
    bg: "#1e2140", panel: "#2a2e57", text: "#f4f1de", muted: "#b8b5d6", grid: "#3a3f6e",
    purple: "#9f7aea", teal: "#22a884", orange: "#e8663d", blue: "#3b8fe0", yellow: "#ffd23f",
    ink: "#0b0d1f", far: "#262a52", red: "#e8465a",
  };
  const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const YEARS = Object.keys(D.releases).sort();
  const REL = YEARS.map(y => D.releases[y]);
  const TU = YEARS.length;                       // level index of the final TUWAIQ ACADEMY level

  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;

  // Fit the canvas inside the iframe viewport ("contain"), keep 16:9, never wider than
  // MAX_W css px. FRAME = canvas border (2 x 3 px) + hard shadow (4 px), so nothing is clipped.
  const MAX_W = 1000, FRAME = 10, BORDER = 3;
  function fit() {
    const k = Math.max(0.1, Math.min((innerWidth - FRAME) / W, (innerHeight - FRAME) / H, MAX_W / W));
    cv.style.width = Math.floor(W * k) + "px";
    cv.style.height = Math.floor(H * k) + "px";
  }
  addEventListener("resize", fit);
  fit();

  const fmtInt = n => Math.round(n).toLocaleString("en-US");
  const pct = x => (x == null ? "?" : Number(x).toFixed(1));
  const rand = (a, b) => a + Math.random() * (b - a);
  function seeded(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

  // ---------------------------------------------------------------- logo (an <img> over the canvas)
  const logoEl = document.getElementById("logo");
  const logoImg = logoEl.querySelector("img");
  let logoOk = false, logoShown = null, logoVisible = false;
  logoImg.onload = () => { logoOk = true; };
  logoImg.onerror = () => { logoOk = false; };
  logoImg.src = window.TUWAIQ_LOGO || "assets/tuwaiq_logo.png";
  // box = the white plate in canvas pixels, or null to hide it
  function placeLogo(box) {
    const key = box && logoOk ? [box.x, box.y, box.w, box.h, cv.style.width].join() : null;
    if (key === logoShown) return;
    logoShown = key;
    logoVisible = !!key;
    if (!key) { logoEl.style.display = "none"; return; }
    const r = cv.getBoundingClientRect(), k = (r.width - 2 * BORDER) / W;
    logoEl.style.left = (r.left + BORDER + box.x * k) + "px";
    logoEl.style.top = (r.top + BORDER + box.y * k) + "px";
    logoEl.style.width = (box.w * k) + "px";
    logoEl.style.height = (box.h * k) + "px";
    logoEl.style.display = "flex";
  }
  addEventListener("resize", () => { logoShown = "resize"; });

  // ---------------------------------------------------------------- pixel font (mostly 3x5)
  const GLYPHS = {
    A: "010101111101101", B: "110101110101110", C: "011100100100011", D: "110101101101110",
    E: "111100110100111", F: "111100110100100", G: "011100101101011", H: "101101111101101",
    I: "111010010010111", J: "001001001101010", K: "101101110101101", L: "100100100100111",
    M: "101111101101101", N: "110101101101101", O: "010101101101010", P: "110101110100100",
    Q: "010101101110011", R: "110101110101101", S: "011100010001110", T: "111010010010010",
    U: "101101101101111", V: "101101101101010", W: "101101111111101", X: "101101010101101",
    Y: "101101010010010", Z: "111001010100111",
    0: "111101101101111", 1: "010110010010111", 2: "110001010100111", 3: "110001010001110",
    4: "101101111001001", 5: "111100110001110", 6: "011100110101010", 7: "111001010010010",
    8: "010101010101010", 9: "010101011001110",
    ".": "000000000000010", ":": "000010000010000",
    "-": "000000111000000", "+": "000010111010000",
    "!": "010010010000010", "?": "110001010000010", "/": "001001010100100",
    "'": "010010000000000", "(": "001010010010001", ")": "100010010010100",
    ">": "100010001010100", "<": "001010100010001", "=": "000111000111000",
    "&": "010101010101011", "$": "011110010011110",
  };
  GLYPHS["—"] = GLYPHS["-"];   // em dash
  GLYPHS["–"] = GLYPHS["-"];   // en dash

  // Wider or taller glyphs, rows separated by "|" (a 3x5 "%" reads as "Z", a comma as "/")
  GLYPHS["%"] = "11001|11010|00100|01011|10011";
  GLYPHS[","] = "000|000|000|000|010|100";
  for (const ch in GLYPHS) {
    const g = GLYPHS[ch];
    GLYPHS[ch] = g.includes("|") ? g.split("|") : g.match(/.{3}/g);
  }
  const advance = ch => (GLYPHS[ch] ? GLYPHS[ch][0].length : 3) + 1;

  function textW(s, k = 1) {
    let w = 0;
    for (const ch of String(s).toUpperCase()) w += advance(ch);
    return Math.max(0, (w - 1) * k);
  }
  function text(str, x, y, col, k = 1, align = "left") {
    str = String(str).toUpperCase();
    if (align === "center") x -= Math.floor(textW(str, k) / 2);
    else if (align === "right") x -= textW(str, k);
    ctx.fillStyle = col;
    for (const ch of str) {
      const rows = GLYPHS[ch];
      if (rows) rows.forEach((r, j) => {
        for (let i = 0; i < r.length; i++) if (r[i] === "1") ctx.fillRect(x + i * k, y + j * k, k, k);
      });
      x += advance(ch) * k;
    }
  }
  function shadowText(str, x, y, col, k = 1, align = "left") {
    text(str, x + k, y + k, PAL.ink, k, align);
    text(str, x, y, col, k, align);
  }
  function wrap(str, max) {
    const lines = [];
    let line = "";
    for (const word of str.split(" ")) {
      if (line && (line + " " + word).length > max) { lines.push(line); line = word; }
      else line = line ? line + " " + word : word;
    }
    if (line) lines.push(line);
    return lines;
  }
  function frameBox(x, y, w, h, col, fill) {
    ctx.fillStyle = fill || PAL.ink; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  }

  // ---------------------------------------------------------------- pixel art
  const CMAP = { k: PAL.ink, y: PAL.yellow, f: PAL.text, p: PAL.purple, t: PAL.teal,
                 b: PAL.blue, o: PAL.orange, m: PAL.muted,
                 w: "#fbfbf6", g: "#c4c8d6", r: "#d3213a", s: "#c98d5e", h: "#3a2416",
                 e: "#22140c", n: "#6b4426", R: PAL.red, P: "#ff9aa8", K: "#4a4e7a",
                 B: "#1f1d27", Q: "#3b3848", G: "#e0ac2e" };
  function sprite(rows) {
    const c = mk(rows[0].length, rows.length), x = c.getContext("2d");
    rows.forEach((r, j) => {
      for (let i = 0; i < r.length; i++) {
        if (CMAP[r[i]]) { x.fillStyle = CMAP[r[i]]; x.fillRect(i, j, 1, 1); }
      }
    });
    return c;
  }
  // The same sprite with a 1 px dark outline (canvas 2 px larger; draw it at x - 1, y - 1)
  function outlined(rows) {
    const src = sprite(rows), c = mk(src.width + 2, src.height + 2), x = c.getContext("2d");
    const sil = mk(src.width, src.height), s = sil.getContext("2d");
    s.drawImage(src, 0, 0); s.globalCompositeOperation = "source-in";
    s.fillStyle = PAL.ink; s.fillRect(0, 0, sil.width, sil.height);
    for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) x.drawImage(sil, dx, dy);
    x.drawImage(src, 1, 1);
    return c;
  }
  // The developer: a black bisht with thin gold trim, worn open over a white thobe, a
  // red-and-white shemagh with a black agal, dark hair and eyes, brown sandals
  // (10 x 13, same size and hitbox as before; B = bisht, Q = its highlight, G = gold trim)
  const BODY = ["...kkkkk..", "..rwrwrwr.", ".rwhsssss.", ".wrhssses.", ".rwwssss..",
                ".wrQGwwwG.", ".rBBGwwwG.", "sBBBGwgwGs", ".BBBGwgwG.", ".BBBGwgwG."];
  const RUN = [
    outlined(BODY.concat([".BBBGwwG..", "gg.....gg.", "nn.....nn."])),
    outlined(BODY.concat(["..BBGwwG..", "...gg.....", "...nn....."])),
    outlined(BODY.concat(["..BBGwwG..", "..gg.gg...", "..nn.nn..."])),
  ];
  const JUMP = outlined(BODY.concat([".BBBGwwG..", ".gg...gg..", ".nn....nn."]));
  const SLIDE = outlined(["..kkkk........", ".rwrwrw.......", "rwhsss........",
                          "wrhses........", ".rQGwwwwwwwG..", "BBBBBsBBBBBGgn",
                          "............nn"]);
  const HOP = outlined([".kkkk.......", "rwrwrw......", "whsesGwwwG..",
                        "rQBBBsBBBGnn", "..........nn"]);
  const BUG_TOP = ["..m.....m..", "...m...m...", "..ooooooo..", ".ooyoooyoo.", ".ooooooooo.",
                   "ooooooooooo", ".ooooooooo."];
  const BUG = [outlined(BUG_TOP.concat([".m.m...m.m."])), outlined(BUG_TOP.concat(["m...m.m...m"]))];
  // A tiny floor bug that lives inside tunnels (6 x 3): slide hop over it
  const SPIKE = [outlined([".oooo.", "oyooyo", "m.mm.m"]), outlined([".oooo.", "oyooyo", ".m..m."])];
  const STAR = sprite(["..y..", ".yyy.", "yyyyy", ".yyy.", ".y.y."]);
  const STAR_SHINE = sprite(["..f..", ".yfy.", "yfffy", ".yfy.", ".y.y."]);
  const HEART = sprite([".RR.RR.", "RPRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."]);
  const HEART_EMPTY = sprite([".KK.KK.", "K..K..K", "K.....K", ".K...K.", "..K.K..", "...K..."]);
  const SOUND_ON = sprite(["...f.....", "..ff...f.", "ffff.f..f", "ffff.f..f", "ffff.f..f",
                           "..ff...f.", "...f....."]);
  const SOUND_OFF = sprite(["...f.....", "..ff.....", "ffff.o.o.", "ffff..o..", "ffff.o.o.",
                            "..ff.....", "...f....."]);

  // Power-ups: hit-related factors from the data (shown on pickup with their real hit rate)
  const POW = {
    shield: { name: "MULTIPLAYER", effect: "SHIELD", col: PAL.teal, dur: 10,
              fact: "MULTIPLAYER INDIE GAMES: " + pct(D.powerups.multiplayer) + "% HITS",
              icon: sprite(["..f...f..", ".fff.fff.", "..f...f..", ".........", ".ttt.ttt.",
                            "ttttttttt", "ttttttttt", ".........", "........."]) },
    magnet: { name: "LOCALIZATION", effect: "STAR MAGNET", col: PAL.blue, dur: 8,
              fact: "INDIE GAMES IN 10+ LANGUAGES: " + pct(D.powerups.languages_10plus) + "% HITS",
              icon: sprite([".........", ".bbbbbbb.", "bbbbbbbbb", "bb.....bb", "bb.....bb",
                            "bb.....bb", "ff.....ff", "ff.....ff", "........."]) },
    cozy:   { name: "COZY", effect: "SLOW MOTION", col: PAL.purple, dur: 5,
              fact: "COZY INDIE GAMES: " + pct(D.powerups.cozy) + "% HITS",
              icon: sprite(["..m.m....", "...m.m...", "..m.m....", ".........", "pppppp...",
                            "pppppppp.", "pppppp.p.", "pppppppp.", ".pppp...."]) },
  };
  const POW_KEYS = Object.keys(POW);

  // ---------------------------------------------------------------- level themes
  // Every level has its own sky, far layer, near layer and ground, drawn once at start-up.
  const TILE = 512;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  function skyCanvas(cols) {                       // a dithered vertical gradient
    const c = mk(W, GROUND), x = c.getContext("2d"), img = x.createImageData(W, GROUND);
    const rgb = cols.map(hexRGB);
    for (let y = 0; y < GROUND; y++) {
      const t = y / (GROUND - 1) * (cols.length - 1);
      const i = Math.min(cols.length - 2, Math.floor(t)), f = t - i;
      for (let xx = 0; xx < W; xx++) {
        const c2 = f > (BAYER[(y & 3) * 4 + (xx & 3)] + 0.5) / 16 ? rgb[i + 1] : rgb[i];
        const k = (y * W + xx) * 4;
        img.data[k] = c2[0]; img.data[k + 1] = c2[1]; img.data[k + 2] = c2[2]; img.data[k + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }
  // Periodic helpers (periods divide TILE so the layers tile seamlessly)
  const wave = (x, period, phase) => Math.sin((x / period + phase) * Math.PI * 2);
  const tri = (x, period, phase) => { const t = ((x / period + phase) % 1 + 1) % 1; return 1 - Math.abs(2 * t - 1); };

  const FAR = {
    city(c, r, T) {                                // office blocks with lit windows
      let x = 0;
      while (x < TILE) {
        const w = Math.min(14 + Math.floor(r() * 18), TILE - x), h = 26 + Math.floor(r() * 56);
        c.fillStyle = T.far; c.fillRect(x, GROUND - h, w, h);
        for (let wy = GROUND - h + 4; wy < GROUND - 4; wy += 5) {
          for (let wx = x + 3; wx < x + w - 3; wx += 4) {
            const q = r();
            if (q < 0.4) { c.fillStyle = q < 0.08 ? T.lit : T.win; c.fillRect(wx, wy, 1, 2); }
          }
        }
        x += w + 1 + Math.floor(r() * 4);
      }
    },
    hills(c, r, T) {                               // rolling hills with a lighter rim
      for (let x = 0; x < TILE; x++) {
        const h = Math.round(34 + 12 * wave(x, 256, 0) + 7 * wave(x, 64, 0.3) + 3 * wave(x, 32, 0.1));
        c.fillStyle = T.far; c.fillRect(x, GROUND - h, 1, h);
        c.fillStyle = T.farTop; c.fillRect(x, GROUND - h, 1, 2);
      }
    },
    dunes(c, r, T) {                               // two rows of sand dunes
      for (let x = 0; x < TILE; x++) {
        const h1 = Math.round(40 + 10 * wave(x, 128, 0.2) + 5 * wave(x, 64, 0.7));
        const h2 = Math.round(20 + 8 * wave(x, 256, 0.5) + 4 * wave(x, 32, 0));
        c.fillStyle = T.far; c.fillRect(x, GROUND - h1, 1, h1);
        c.fillStyle = T.farTop; c.fillRect(x, GROUND - h2, 1, h2);
      }
    },
    mountains(c, r, T) {                           // sharp peaks with snow caps
      for (let x = 0; x < TILE; x++) {
        const h = Math.round(22 + 46 * tri(x, 128, 0) * (0.65 + 0.35 * tri(x, 512, 0.25)) + 8 * tri(x, 32, 0.5));
        c.fillStyle = T.far; c.fillRect(x, GROUND - h, 1, h);
        if (h > 48) { c.fillStyle = T.farTop; c.fillRect(x, GROUND - h, 1, Math.min(8, h - 46)); }
      }
    },
    towers(c, r, T) {                              // a dense wall of tall, busy towers
      let x = 0;
      while (x < TILE) {
        const w = Math.min(8 + Math.floor(r() * 10), TILE - x), h = 40 + Math.floor(r() * 70);
        c.fillStyle = T.far; c.fillRect(x, GROUND - h, w, h);
        for (let wy = GROUND - h + 3; wy < GROUND - 3; wy += 4) {
          for (let wx = x + 2; wx < x + w - 2; wx += 3) {
            const q = r();
            if (q < 0.6) { c.fillStyle = q < 0.2 ? T.lit : q < 0.32 ? T.lit2 : T.win; c.fillRect(wx, wy, 1, 2); }
          }
        }
        if (r() < 0.4) { c.fillStyle = T.lit2; c.fillRect(x + Math.floor(w / 2), GROUND - h - 5, 1, 5); }
        x += w + Math.floor(r() * 2);
      }
    },
    skyline(c, r, T) {                             // a campus skyline with stepped roofs
      let x = 0;
      while (x < TILE) {
        const w = Math.min(18 + Math.floor(r() * 18), TILE - x), h = 30 + Math.floor(r() * 50);
        c.fillStyle = T.far; c.fillRect(x, GROUND - h, w, h);
        const sw = Math.floor(w * 0.55), sh = 6 + Math.floor(r() * 10);
        c.fillRect(x, GROUND - h - sh, sw, sh);
        for (let wy = GROUND - h + 4; wy < GROUND - 4; wy += 5) {
          for (let wx = x + 3; wx < x + w - 3; wx += 4) {
            const q = r();
            if (q < 0.45) { c.fillStyle = q < 0.12 ? T.lit : T.win; c.fillRect(wx, wy, 2, 2); }
          }
        }
        x += w + 2 + Math.floor(r() * 6);
      }
    },
  };
  const MID = {
    racks(m, r, T, L) {                            // server racks with blinking LEDs
      let x = 10;
      while (x < TILE - 34) {
        const w = 20 + Math.floor(r() * 8), h = 36 + Math.floor(r() * 28), top = GROUND - h;
        m.fillStyle = PAL.ink; m.fillRect(x - 1, top - 1, w + 2, h + 1);
        m.fillStyle = T.mid; m.fillRect(x, top, w, h);
        for (let sy = top + 3; sy < GROUND - 6; sy += 6) {
          m.fillStyle = T.midHi; m.fillRect(x + 2, sy, w - 4, 4);
          m.fillStyle = PAL.ink; m.fillRect(x + 3, sy + 1, w - 10, 2);
          L.push({ x: x + w - 5, y: sy + 1, k: Math.floor(r() * 100), s: 2 });
        }
        x += w + 14 + Math.floor(r() * 40);
      }
    },
    pines(m, r, T, L) {                            // pine trees and fireflies
      let x = 6;
      while (x < TILE - 16) {
        const s = 4 + Math.floor(r() * 4), cx = x + s + 1;
        let y = GROUND - 4 - s * 5;
        m.fillStyle = T.trunk; m.fillRect(cx - 1, GROUND - 5, 3, 5);
        for (let layer = 0; layer < 3; layer++) {
          const hw = s - 1 + layer * 2;
          for (let j = 0; j < s * 2; j++) {
            const half = Math.round(hw * (j + 1) / (s * 2));
            m.fillStyle = PAL.ink; m.fillRect(cx - half - 1, y + j, half * 2 + 3, 1);
            m.fillStyle = j < 2 ? T.midHi : T.mid; m.fillRect(cx - half, y + j, half * 2 + 1, 1);
          }
          y += s + 1;
        }
        if (r() < 0.6) L.push({ x: cx + Math.floor(rand(-14, 14)), y: GROUND - 20 - Math.floor(r() * 50), k: Math.floor(r() * 100), s: 1 });
        x += s * 2 + 8 + Math.floor(r() * 26);
      }
    },
    mesas(m, r, T, L) {                            // flat-topped mesas and cacti
      let x = 4;
      while (x < TILE - 70) {
        const w = 40 + Math.floor(r() * 30), h = 26 + Math.floor(r() * 24);
        for (let j = 0; j < h; j++) {
          const inset = Math.max(0, 6 - Math.floor(j / 2));
          m.fillStyle = j < 3 ? T.midHi : T.mid;
          m.fillRect(x + inset, GROUND - h + j, w - inset * 2, 1);
        }
        const cx = x + w + 8 + Math.floor(r() * 10), ch = 10 + Math.floor(r() * 7);

      g.items.push({ kind: "power", p: kind, x: midX - 6, y: GROUND - 28, taken: false });

      const n = 3 + Math.floor(Math.random() * 3), rowW = (n - 1) * 10 + 5;
      if (len - 40 < rowW) return;

  }

  // ---------------------------------------------------------------- update
  function gapAt(wx) {
    for (const o of g.obs) if (o.type === "gap" && wx > o.x + 2 && wx < o.x + o.w - 2) return o;
    return null;
  }
  // Is the player under (or just about to enter) a low ceiling?
  function underCeiling() {
    const a = g.dist + PX, b = g.dist + PX + 18;
    return g.obs.some(o => (o.type === "tunnel" || o.type === "crunch") && a < o.x + o.w && b > o.x);
  }
  function burst(x, y, col, n, power) {
    for (let i = 0; i < n && g.parts.length < 240; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(20, power || 90);
      g.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
                     life: rand(0.3, 0.7), col: col });
    }
  }
  function floatText(str, x, y, col) { g.floats.push({ text: str, x: x, y: y, col: col, t: 0.8 }); }
  function shake(n) { if (!REDUCED) g.shake = Math.max(g.shake, n); }

  const sliding = () => p.onGround && (input.slideHeld || p.slideMin > 0);
  function land() {
    p.y = GROUND; p.vy = 0; p.onGround = true; p.jumps = 2; p.hop = false;
  }
  function bounceUp() {             // out of a pit: thrown back up
    p.y = GROUND + 4; p.vy = -JUMP_V * 1.05; p.jumps = 1; p.hop = false;
  }
  function fallInPit() {
    g.pits++;
    if (g.invuln > 0) { bounceUp(); return; }
    if (g.shield > 0) {             // MULTIPLAYER shield: a teammate throws you back up
      g.shield = 0; g.invuln = 1;
      bounceUp();
      burst(PX + 5, GROUND, PAL.teal, 14);
      floatText("SAVED!", PX - 4, GROUND - 24, PAL.teal);
      sfx("power");

  }
  function updatePlayer(dt) {
    p.anim += dt * g.speed / 9;

    if (p.onGround && gapAt(g.dist + PX + 5)) { p.onGround = false; p.coyote = 0.08; }
    if (!p.onGround && p.coyote <= 0 && p.jumps === 2) p.jumps = 1;
    if (p.buffer > 0) {
      if (sliding() && underCeiling()) {
        // Slide hop: a short, low hop that stays under the ceiling
        p.vy = 0; p.hopT = 0; p.onGround = false; p.hop = true; p.jumps = 0; p.buffer = 0;
        sfx("hop");
      } else if (p.jumps > 0 && !p.hop) {
        p.vy = p.jumps === 2 ? -JUMP_V : -DOUBLE_V;
        p.jumps--; p.buffer = 0; p.coyote = 0; p.onGround = false; p.slideMin = 0;
        burst(PX + 5, p.y, p.jumps === 0 ? PAL.purple : PAL.muted, 5, 40);

      p.hopT += dt;

      p.vy += grav * dt;
      p.y += p.vy * dt;

  function playerBox() {
    if (p.hop) return { x: PX + 1, y: p.y - 5, w: 10, h: 5 };

  }
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function updateItems(dt) {
    const box = playerBox();
    const pcx = g.dist + box.x + box.w / 2, pcy = box.y + box.h / 2;
    for (const it of g.items) {
      if (it.taken) continue;
      if (it.kind === "star" && g.magnet > 0) {          // LOCALIZATION magnet
        const dx = pcx - (it.x + 2), dy = pcy - (it.y + 2), d = Math.hypot(dx, dy);
        if (d < 80 && d > 0.5) { const s = Math.min(d, 230 * dt); it.x += dx / d * s; it.y += dy / d * s; }
      }
      const size = it.kind === "star" ? 5 : 13;
      if (!overlap(box, { x: it.x - g.dist, y: it.y, w: size, h: size })) continue;
      it.taken = true;
      const sx = it.x - g.dist + size / 2, sy = it.y + size / 2;
      if (it.kind === "star") {
        g.stars++;
        burst(sx, sy, PAL.yellow, 8, 70);
        floatText("+10", sx - 5, sy - 8, PAL.yellow);
      } else {
        const P = POW[it.p];
        g[it.p] = P.dur;

  }
  // Take one hit: returns true if the player is still alive
  function loseLife() {

  }
  function hit(o) {

  function countPassed() {          // stats for the test hook

  function die() {
    state = "dying";

  function gameOver(finished) {

    const top = D.top_subgenres[0];
    const facts = [
      "ONLY " + pct(D.indie_hit_rate) + "% OF INDIE GAMES BECOME HITS (TOP 5% OF REVIEWS IN THEIR YEAR).",
      pct(D.few_reviews_pct) + "% OF GAMES GET FEWER THAN 10 REVIEWS.",
      "INDIE HIT RATE: " + pct(D.indie_hit_rate) + "% VS " + pct(D.overall_hit_rate) + "% FOR ALL GAMES.",
      "ONE PLAYER AWAY? MULTIPLAYER INDIE GAMES HIT " + pct(D.powerups.multiplayer) + "% OF THE TIME, SINGLE-PLAYER " + pct(D.powerups.single_player) + "%.",
    ];
    if (top) facts.push(top.name + " HAS THE BEST INDIE HIT RATE: " + pct(top.hit_rate) + "% (" + fmtInt(top.games) + " GAMES).");
    if (g.L < YEARS.length) facts.push("YOU REACHED " + YEARS[g.L] + ": " + fmtInt(REL[g.L]) + " INDIE GAMES WERE RELEASED THAT YEAR.");
    else facts.push("YOU SURVIVED " + YEARS[0] + "–" + YEARS[YEARS.length - 1] + ": " + fmtInt(REL.reduce((a, b) => a + b, 0)) + " INDIE RELEASES.");
    let next = facts[Math.floor(Math.random() * facts.length)];

  function reachGoal() {

  function chooseGoal(i) {

  function updateParticles(dt) {

  // Time, level, speed, distance and spawning: everything that does not depend on the player
  function advanceWorld(dt) {

      g.levelT -= LEVEL_TIME; g.fromL = g.L; g.L++; g.fade = 0.6;
      g.banner = { L: g.L, t: g.L === TU ? 2.6 : 2.2 };
      sfx("level");

  }
  function update(rdt) {

    for (const k of ["shield", "magnet", "cozy", "invuln"]) g[k] = Math.max(0, g[k] - rdt);
    if (g.banner && (g.banner.t -= rdt) <= 0) g.banner = null;
    if (g.toast && (g.toast.t -= rdt) <= 0) g.toast = null;
    g.fade = Math.max(0, g.fade - rdt);
    g.shake = Math.max(0, g.shake - rdt * 30);

      p.vy += GRAVITY * rdt; p.y += p.vy * rdt;

  // ---------------------------------------------------------------- render
  function drawScene(T, dist, alpha) {

      return null;
    }
    if (B.L >= TU) {                               // the final level: name + logo
      const w = 204, x0 = (W - w) / 2, y0 = 16;
      frameBox(x0, y0, w, 78, T.accent, "rgba(11, 13, 31, 0.9)");
      text("FINAL LEVEL", W / 2, y0 + 5, PAL.muted, 1, "center");
      shadowText("TUWAIQ ACADEMY", W / 2, y0 + 13, T.accent, 3, "center");
      text("REACH " + fmtInt(GOAL) + " POINTS!", W / 2, y0 + 68, PAL.yellow, 1, "center");
      return { x: W / 2 - 60, y: y0 + 34, w: 120, h: 28 };
    }
    const w = 186, x0 = (W - w) / 2, y0 = 22;
    frameBox(x0, y0, w, 52, T.accent, "rgba(11, 13, 31, 0.88)");
    text("LEVEL " + (B.L + 1) + " OF " + (TU + 1) + ": " + T.name, W / 2, y0 + 5, PAL.muted, 1, "center");
    shadowText(YEARS[B.L], W / 2, y0 + 13, T.accent, 4, "center");
    shadowText(fmtInt(REL[B.L]) + " INDIE RELEASES", W / 2, y0 + 37, PAL.yellow, 2, "center");
    return null;
  }
  function drawHUD() {
    let logo = null;
    ctx.fillStyle = "rgba(11, 13, 31, 0.6)"; ctx.fillRect(0, 0, W, 11);
    const s = score();
    shadowText("SCORE " + pad(s), 4, 3, PAL.text);
    shadowText(g.L < TU ? "YEAR " + YEARS[g.L] : levelName(g.L), W / 2, 3, themeOf(g.L).accent, 1, "center");
    shadowText("BEST " + pad(Math.max(best, s)), W - 4, 3, PAL.text, 1, "right");
    let x = 4;
    for (const k of POW_KEYS) {
      if (g[k] <= 0) continue;
      const P = POW[k];
      shadowText(P.name, x, 14, P.col);
      x += textW(P.name) + 3;
      ctx.fillStyle = PAL.ink; ctx.fillRect(x, 14, 26, 5);
      ctx.fillStyle = P.col; ctx.fillRect(x + 1, 15, Math.ceil(24 * g[k] / P.dur), 3);
      x += 32;
    }
    for (let i = 0; i < LIVES; i++) {              // lives as pixel hearts, top right
      const hx = W - 4 - (LIVES - i) * 9;
      ctx.fillStyle = PAL.ink; ctx.fillRect(hx - 1, 13, 9, 8);
      ctx.drawImage(i < g.lives ? HEART : HEART_EMPTY, hx, 14);
    }
    if (g.banner && state === "play") logo = drawBanner();
    if (g.toast) {
      const t = g.toast, w = Math.max(textW(t.title), textW(t.fact)) + 12;
      const x0 = Math.floor((W - w) / 2), y0 = g.banner ? 98 : 44;
      ctx.fillStyle = PAL.ink; ctx.fillRect(x0, y0, w, 20);
      ctx.fillStyle = t.col; ctx.fillRect(x0, y0, w, 1); ctx.fillRect(x0, y0 + 19, w, 1);
      text(t.title, W / 2, y0 + 4, t.col, 1, "center");
      text(t.fact, W / 2, y0 + 11, PAL.text, 1, "center");
    }
    if (touchUsed && state === "play") {            // the touch slide button
      const b = SLIDE_BTN, on = input.slideTouch !== null;
      frameBox(b.x, b.y, b.w, b.h, on ? PAL.yellow : PAL.muted, on ? "rgba(255, 210, 63, 0.35)" : "rgba(11, 13, 31, 0.55)");
      text("SLIDE", b.x + b.w / 2, b.y + 6, on ? PAL.yellow : PAL.text, 1, "center");
    }
    drawMute();
    return logo;
  }
  function dim(a) { ctx.fillStyle = "rgba(11, 13, 31, " + a + ")"; ctx.fillRect(0, 0, W, H); }
  const blink = () => Math.floor(clock * 2.5) % 2 === 0;

  function drawTitle() {
    ctx.drawImage(RUN[[0, 1, 2, 1][Math.floor(clock * 10) % 4]], PX - 1, GROUND - 14);
    dim(0.4);
    shadowText("INDIE RUN", W / 2, 12, PAL.yellow, 4, "center");
    text("SURVIVE 2020 — 2024, THEN THE TUWAIQ ACADEMY LEVEL", W / 2, 37, PAL.muted, 1, "center");
    if (blink()) shadowText("PRESS START", W / 2, 49, PAL.yellow, 2, "center");
    shadowText("CLICK TO FOCUS, SPACE TO JUMP", W / 2, 66, PAL.text, 1, "center");
    text("SPACE / UP / W: JUMP, PRESS TWICE TO DOUBLE JUMP", W / 2, 77, PAL.muted, 1, "center");
    text("DOWN / S: HOLD TO SLIDE (JUMP WHILE SLIDING IN A TUNNEL = HOP)", W / 2, 85, PAL.muted, 1, "center");
    text("P: PAUSE     M: SOUND ON / OFF", W / 2, 93, PAL.muted, 1, "center");
    text("TOUCH: TAP = JUMP, HOLD SLIDE BUTTON OR SWIPE DOWN = SLIDE", W / 2, 101, PAL.muted, 1, "center");
    shadowText("3 LIVES. REACH " + fmtInt(GOAL) + " POINTS!", W / 2, 113, PAL.teal, 1, "center");
    if (best > 0) shadowText("BEST " + pad(best), W / 2, 123, PAL.text, 1, "center");
    drawMute();
  }
  function drawPaused() {
    dim(0.6);
    shadowText("PAUSED", W / 2, 52, PAL.yellow, 3, "center");
    text("PRESS P OR CLICK TO RESUME", W / 2, 80, PAL.text, 1, "center");
    drawMute();
  }
  const GOAL_BTNS = [{ label: "CONTINUE", x: W / 2 - 74, y: 100, w: 70, h: 15 },
                     { label: "FINISH", x: W / 2 + 4, y: 100, w: 70, h: 15 }];
  function drawGoal() {
    dim(0.8);
    shadowText("CONGRATULATIONS!", W / 2, 7, PAL.yellow, 3, "center");
    shadowText("YOU MADE IT", W / 2, 26, PAL.text, 2, "center");
    text("THANK YOU FOR PLAYING, AND THANK YOU, TUWAIQ ACADEMY!", W / 2, 41, PAL.muted, 1, "center");
    text("SCORE " + fmtInt(score()), W / 2, 89, PAL.teal, 1, "center");
    GOAL_BTNS.forEach((b, i) => {
      const on = i === goalSel;
      frameBox(b.x, b.y, b.w, b.h, on ? PAL.yellow : PAL.muted, on ? "#3a2a8a" : PAL.ink);
      text((on ? "> " : "") + b.label, b.x + b.w / 2, b.y + 5, on ? PAL.yellow : PAL.text, 1, "center");
    });
    text("CONTINUE = ENDLESS RUN     FINISH = FINAL SCORE", W / 2, 122, PAL.muted, 1, "center");
    text("ARROWS + ENTER, C / F, OR TAP A BUTTON", W / 2, 131, PAL.muted, 1, "center");
    drawMute();
    return { x: W / 2 - 60, y: 50, w: 120, h: 34 };
  }
  function drawOver() {
    dim(0.72);
    if (g.finished) shadowText("RUN COMPLETE", W / 2, 12, PAL.teal, 3, "center");
    else shadowText("GAME OVER", W / 2, 12, PAL.orange, 4, "center");
    shadowText((g.finished ? "FINAL SCORE " : "SCORE ") + score(), W / 2, 40, PAL.text, 2, "center");
    text("BEST " + best + (newBest ? "   NEW BEST!" : ""), W / 2, 56, newBest && blink() ? PAL.yellow : PAL.muted, 1, "center");
    text("REACHED: " + levelName(g.L) + "     STARS: " + g.stars, W / 2, 64, PAL.muted, 1, "center");
    const lines = wrap(fact, 60), bh = lines.length * 8 + 16, y0 = 76;
    const bw = Math.max.apply(null, lines.map(l => textW(l))) + 16, x0 = Math.floor((W - bw) / 2);
    frameBox(x0, y0, bw, bh, PAL.yellow, PAL.panel);
    text("REAL DATA", W / 2, y0 + 4, PAL.yellow, 1, "center");
    lines.forEach((l, i) => text(l, W / 2, y0 + 12 + i * 8, PAL.text, 1, "center"));
    if (stateT > 0.6 && blink()) shadowText("PRESS SPACE OR TAP TO RESTART", W / 2, 140, PAL.yellow, 1, "center");
    drawMute();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
    const playing = state !== "title";
    const sh = playing && g.shake > 0 && !REDUCED ? g.shake * 0.5 : 0;
    ctx.translate(Math.round(rand(-sh, sh)), Math.round(rand(-sh, sh)));
    const dist = playing ? g.dist : titleScroll;
    if (!playing) drawScene(THEMES[0], dist, 1);
    else if (g.fade > 0) {                         // cross-fade into the new level's theme
      drawScene(themeOf(g.fromL), dist, 1);
      drawScene(themeOf(g.L), dist, 1 - g.fade / 0.6);
    } else drawScene(themeOf(g.L), dist, 1);
    let logo = null;
    if (playing) { drawGaps(dist); drawItems(); drawObstacles(); drawPlayer(); drawEffects(); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!playing) drawTitle();
    else {
      logo = drawHUD();
      if (state === "paused") drawPaused();
      if (state === "goal") logo = drawGoal();
      if (state === "over") drawOver();
    }
    placeLogo(logo);
  }

  // ---------------------------------------------------------------- input
  const JUMP_KEYS = new Set(["Space", "ArrowUp", "KeyW"]);
  const SLIDE_KEYS = new Set(["ArrowDown", "KeyS"]);
  // Physical keys held right now. A keydown for a key already held is OS key repeat, even when
  // the browser does not set event.repeat; repeats never jump again or restart a slide.
  const keysDown = new Set();
  const KEY_NAMES = { " ": "Space", Spacebar: "Space", Enter: "Enter", ArrowUp: "ArrowUp",
                      ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight", Down: "ArrowDown", Up: "ArrowUp" };
  function keyCode(e) {           // event.code, or a fallback from event.key
    if (e.code) return e.code;
    const k = e.key || "";
    return KEY_NAMES[k] || (k.length === 1 && /[a-z]/i.test(k) ? "Key" + k.toUpperCase() : k);
  }
  function refreshSlide() {
    const held = input.slideKeys.size > 0 || input.slideTouch !== null;
    if (held && !input.slideHeld && state === "play") {
      p.slideMin = 0.15;                          // a quick tap still shows a short slide
      if (!p.onGround && !p.hop) p.fastFall = 0.5;
    }
    input.slideHeld = held;
  }
  function tapAction() {
    if (state === "title") start();
    else if (state === "over") { if (stateT > 0.6) start(); }
    else if (state === "paused") resume();
    else if (state === "play") p.buffer = 0.12;
  }
  addEventListener("keydown", e => {
    const c = keyCode(e), isJump = JUMP_KEYS.has(c), isSlide = SLIDE_KEYS.has(c);
    if (isJump || isSlide || c === "KeyP" || c === "KeyM") e.preventDefault();
    if (e.repeat || keysDown.has(c)) return;      // key repeat
    keysDown.add(c);
    unlockAudio();                                 // browsers start audio only after a gesture
    if (c === "KeyM") { toggleMute(); return; }
    if (state === "title" || state === "over") { if (isJump || c === "Enter") tapAction(); return; }
    if (state === "paused") { if (c === "KeyP" || isJump) resume(); return; }
    if (state === "goal") {
      if (c === "ArrowLeft" || c === "KeyA" || c === "ArrowUp") { if (goalSel !== 0) sfx("blip"); goalSel = 0; }
      else if (c === "ArrowRight" || c === "KeyD" || c === "ArrowDown") { if (goalSel !== 1) sfx("blip"); goalSel = 1; }
      else if (c === "Enter" || c === "Space") chooseGoal(goalSel);
      else if (c === "KeyC") chooseGoal(0);
      else if (c === "KeyF") chooseGoal(1);
      return;
    }
    if (state !== "play") return;
    if (c === "KeyP") { pause(); return; }
    if (isJump) { input.jumpHeld = true; p.buffer = 0.12; }
    if (isSlide) { input.slideKeys.add(c); refreshSlide(); }
  });
  addEventListener("keyup", e => {
    const c = keyCode(e);
    keysDown.delete(c);
    if (JUMP_KEYS.has(c)) {
      input.jumpHeld = false;
      if (state === "play" && !p.hop && p.vy < -130) p.vy = -130;   // short tap = short hop
    }
    if (SLIDE_KEYS.has(c)) { input.slideKeys.delete(c); refreshSlide(); }
  });
  // Pointer position in canvas pixels
  function toCanvas(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    return { x: (clientX - r.left - BORDER) * W / (r.width - 2 * BORDER),
             y: (clientY - r.top - BORDER) * H / (r.height - 2 * BORDER) };
  }
  const inBox = (q, b) => q.x >= b.x && q.x < b.x + b.w && q.y >= b.y && q.y < b.y + b.h;
  // Clicks and taps on the mute icon and the goal buttons; returns true when handled
  function pressUI(q) {
    if (inBox(q, MUTE_BOX)) { toggleMute(); return true; }
    if (state === "goal") {
      GOAL_BTNS.forEach((b, i) => { if (inBox(q, b)) { goalSel = i; chooseGoal(i); } });
      return true;
    }
    return false;
  }
  cv.addEventListener("mousedown", e => {
    e.preventDefault();
    try { window.focus(); cv.focus(); } catch (err) { /* ignore */ }
    if (!pressUI(toCanvas(e.clientX, e.clientY))) tapAction();
  });
  // Touch: tap = jump; hold the SLIDE button (bottom right), or swipe down and hold, to slide.
  // Fingers are tracked one by one, so you can hold SLIDE with one and tap with another.
  const touches = {};
  cv.addEventListener("touchstart", e => {
    e.preventDefault();
    touchUsed = true;
    for (const t of e.changedTouches) {
      const q = toCanvas(t.clientX, t.clientY);
      if (pressUI(q)) continue;
      if (state === "play" && inBox(q, SLIDE_ZONE)) {
        input.slideTouch = t.identifier; refreshSlide();
        touches[t.identifier] = { slide: true };
      } else touches[t.identifier] = { y: t.clientY, swiped: false, t0: performance.now() };
    }
  }, { passive: false });
  cv.addEventListener("touchmove", e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const tr = touches[t.identifier];
      if (!tr || tr.slide || tr.swiped) continue;
      if (t.clientY - tr.y > 24) {
        tr.swiped = true;
        if (state === "play") { input.slideTouch = t.identifier; refreshSlide(); }
      }
    }
  }, { passive: false });
  // iOS Safari can send touchcancel instead of touchend when two fingers are used (hold SLIDE,
  // tap to hop): a cancelled finger that is still on the screen keeps sliding, and a short
  // cancelled tap still counts as a tap
  function touchEnd(e) {
    e.preventDefault();
    const still = new Set(Array.from(e.touches || [], t => t.identifier));
    for (const t of e.changedTouches) {
      if (e.type === "touchcancel" && still.has(t.identifier)) continue;
      const tr = touches[t.identifier];
      delete touches[t.identifier];
      if (input.slideTouch === t.identifier) { input.slideTouch = null; refreshSlide(); }
      const tap = tr && !tr.slide && !tr.swiped &&
        (e.type === "touchend" || performance.now() - tr.t0 < 300);
      if (tap) tapAction();
    }
  }
  cv.addEventListener("touchend", touchEnd, { passive: false });
  cv.addEventListener("touchcancel", touchEnd, { passive: false });
  // Every gesture Safari accepts for audio (iOS counts touchend, not touchstart) unlocks it,
  // synchronously, before anything else
  ["pointerdown", "touchend", "click"].forEach(type =>
    addEventListener(type, unlockAudio, { capture: true, passive: true }));
  // Pause automatically when the game loses focus
  addEventListener("blur", () => { keysDown.clear(); pause(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { keysDown.clear(); pause(); } });

  // ---------------------------------------------------------------- main loop (fixed timestep)
  // At most 4 steps (67 ms) per frame: 30 fps (Safari in Low Power Mode or a throttled iframe)
  // still runs at full speed, but after a stall the game slows down for a moment instead of
  // jumping ahead in one burst (the world used to leap up to 250 ms while nothing was drawn)
  const MAX_FRAME = 4 * STEP;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(MAX_FRAME, Math.max(0, (now - last) / 1000));
    last = now;
    while (acc >= STEP) { clock += STEP; update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Internals for the offline fairness check (tools/check_indie_run.js). Only exposed when a
  // test defines window.INDIE_RUN_LAB before the game loads; the dashboard never does.
  if (window.INDIE_RUN_LAB) {
    Object.defineProperties(window.INDIE_RUN_LAB, Object.getOwnPropertyDescriptors({
      consts: { STEP, GROUND, PX, TU, LEVEL_TIME, CEIL, SPIKE_W, W },
      start() { reset(); state = "play"; },
      get g() { return g; },
      get p() { return p; },
      set p(v) { p = v; },
      input, speedFor, advanceWorld, updatePlayer, firstHit, sliding,
    }));
  }

  // Read-only hook for automated tests
  window.INDIE_RUN = {
    get state() { return state; },
    get score() { return g ? score() : 0; },
    get year() { return g ? levelName(g.L) : null; },
    get level() { return g ? g.L : null; },
    get theme() { return g ? themeOf(g.L).name : THEMES[0].name; },
    get levelTime() { return g ? g.levelT : 0; },
    get lives() { return g ? g.lives : LIVES; },
    get invuln() { return g ? g.invuln : 0; },
    get speed() { return g ? g.speed : 0; },
    get muted() { return muted; },
    get audioState() { return actx ? actx.state : "none"; },
    get sfxPlayed() { return sfxPlayed; },
    get banner() { return g && g.banner ? (g.banner.endless ? "ENDLESS" : levelName(g.banner.L)) : null; },
    get logoVisible() { return logoVisible; },
    get player() {
      return p ? { y: p.y, onGround: p.onGround, sliding: g ? sliding() : false, hop: p.hop } : null;
    },
    get stats() {
      return g ? { hits: g.hits, tunnelsPassed: g.tunnelsPassed, hopsCleared: g.hopsCleared,
                   stars: g.stars, finished: g.finished, endless: g.endless } : null;
    },
    get ahead() {
      const o = g && g.obs.find(o => !o.dead && o.x + o.w - g.dist > PX);
      return o ? { type: o.type, dx: o.x - g.dist - (PX + 10), w: o.w } : null;
    },
    // the next obstacles, nearest first (dx = distance from the player's front edge)
    get obstacles() {
      if (!g) return [];
      return g.obs.filter(o => !o.dead && o.x + o.w - g.dist > PX - 4).slice(0, 6)
        .map(o => ({ type: o.type, dx: o.x - g.dist - (PX + 10), w: o.w }));
    },
  };
})();
</script>
</body>
</html>
